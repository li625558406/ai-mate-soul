<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>avatar-overlay</title>
<style>
  /* 整窗可拖动（Electron -webkit-app-region） */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               -webkit-app-region: drag; }
  /* canvas 铺满窗口（CSS 跟随）：拉伸窗口 → CSS 尺寸变化 → avatar.js 的
     ResizeObserver 触发 renderer.resize + fit。!important 必须保留：PIXI
     autoDensity 会把 canvas 内联样式固定成创建时的 px 值，仅样式表规则会被
     内联样式覆盖，导致 Observer 永不触发。小窗整块设为拖动区、放弃视线
     追踪——拖动区 mousemove 被 OS 吞掉，拖动与视线互斥；视线追踪在主窗口保留 */
  canvas { width: 100vw !important; height: 100vh !important; display: block; -webkit-app-region: drag; }
</style>
</head>
<body>
<canvas id="avatarCanvas"></canvas>
<script src="/live2d/live2dcubismcore.min.js"></script>
<script src="/live2d/vendor/pixi.min.js"></script>
<script src="/live2d/vendor/cubism4.min.js"></script>
<script src="/live2d/avatar.js"></script>
<script>
  Avatar.mount(document.getElementById('avatarCanvas'));
</script>
</body>
</html>
